services:
  - type: web
    name: smartpos-guest
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: OWNER_FIREBASE_PROJECT_ID
        sync: false
      - key: OWNER_FIRESTORE_DATABASE_ID
        sync: false
      - key: STORE_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: KIRIMINAJA_API_KEY
        sync: false
      - key: KIRIMINAJA_BASE_URL
        value: https://tdev.kiriminaja.com
      - key: KIRIMINAJA_ORIGIN_DISTRICT_ID
        sync: false
      - key: KIRIMINAJA_TIMEOUT_MS
        value: "8000"

